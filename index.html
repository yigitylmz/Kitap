<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Satır — Bulut Okuma Günlüğü</title>
  <meta name="description" content="Hesap senkronizasyonlu, odaklı kitap okuma takip platformu." />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Satır" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0a09" />

  <!-- ESKİ BOZUK SERVICE WORKER ÖNBELLEĞİNİ ANINDA TEMİZLE -->
  <script>
    (function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) { regs[i].unregister(); }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function(keys) {
          for (var i = 0; i < keys.length; i++) { caches.delete(keys[i]); }
        });
      }
    })();
  </script>

  <!-- TAM BAĞIMSIZ MODERN UI / UX / ANIMATION STİLLERİ -->
  <style>
    :root, [data-theme="dark"] {
      --bg-deep: #0b0a09;
      --bg-surface: rgba(26, 23, 20, 0.78);
      --bg-elevated: rgba(40, 35, 31, 0.9);
      --text-main: #faf7f2;
      --text-muted: #a69f95;
      --accent: #f59e0b;
      --accent-glow: rgba(245, 158, 11, 0.35);
      --accent-soft: rgba(245, 158, 11, 0.15);
      --border-glass: rgba(255, 255, 255, 0.09);
      --border-highlight: rgba(245, 158, 11, 0.45);
      --success: #10b981;
      --danger: #f43f5e;
    }
    [data-theme="light"] {
      --bg-deep: #f6f3ec;
      --bg-surface: rgba(255, 255, 255, 0.88);
      --bg-elevated: rgba(245, 240, 230, 0.95);
      --text-main: #1c1917;
      --text-muted: #6b635b;
      --accent: #d97706;
      --accent-glow: rgba(217, 119, 6, 0.25);
      --accent-soft: rgba(217, 119, 6, 0.12);
      --border-glass: rgba(0, 0, 0, 0.08);
      --border-highlight: rgba(217, 119, 6, 0.4);
    }
    [data-theme="sepia"] {
      --bg-deep: #efe6d5;
      --bg-surface: rgba(251, 245, 232, 0.88);
      --bg-elevated: rgba(238, 226, 205, 0.95);
      --text-main: #332722;
      --text-muted: #756257;
      --accent: #b45309;
      --accent-glow: rgba(180, 83, 9, 0.25);
      --accent-soft: rgba(180, 83, 9, 0.13);
      --border-glass: rgba(51, 39, 34, 0.12);
      --border-highlight: rgba(180, 83, 9, 0.4);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background: var(--bg-deep);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      overflow-x: hidden;
      display: block;
    }

    /* AURORA ARKA PLAN EFEKTİ */
    .aurora-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .aurora-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(95px);
      opacity: 0.25;
      animation: floatOrb 16s infinite alternate ease-in-out;
    }
    .orb-1 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, #f59e0b, transparent 70%);
      top: -120px; left: calc(50% - 300px);
    }
    .orb-2 {
      width: 340px; height: 340px;
      background: radial-gradient(circle, #ec4899, transparent 70%);
      bottom: 40px; right: calc(50% - 300px);
      animation-delay: -6s;
    }
    .orb-3 {
      width: 280px; height: 280px;
      background: radial-gradient(circle, #3b82f6, transparent 70%);
      top: 38%; left: 48%;
      animation-delay: -11s;
      opacity: 0.15;
    }
    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 25px) scale(1.15); }
    }

    /* VFX CANVAS */
    #vfx-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9998;
    }

    /* SABİT ÜST HEADER */
    .app-header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 68px;
      background: var(--bg-surface);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border-glass);
      z-index: 1000;
      display: flex;
      justify-content: center;
      padding: 0 18px;
    }
    .header-inner {
      width: 100%;
      max-width: 720px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-container { display: flex; align-items: center; gap: 12px; }
    .brand-icon-wrap {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 16px var(--accent-glow);
      font-size: 20px;
    }
    .brand-title { font-size: 19px; font-weight: 800; margin: 0; letter-spacing: -0.3px; }
    .brand-subtitle { font-size: 11.5px; color: var(--text-muted); display: block; margin-top: 2px; }

    .header-actions { display: flex; align-items: center; gap: 10px; }
    .streak-pill {
      border: 1px solid var(--border-highlight);
      background: var(--accent-soft);
      color: var(--accent);
      padding: 7px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
      display: flex; align-items: center; gap: 6px;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.2s;
    }
    .streak-pill:hover { transform: translateY(-2px) scale(1.03); box-shadow: 0 6px 18px var(--accent-glow); }

    .sync-status-indicator {
      position: relative;
      width: 38px; height: 38px;
      border-radius: 12px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .sync-status-indicator:hover { border-color: var(--accent); transform: translateY(-2px); }
    .sync-dot {
      position: absolute;
      top: 6px; right: 6px;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }
    .sync-dot.online { background: #10b981; box-shadow: 0 0 8px #10b981; }

    /* ANA İÇERİK KONTEYNERİ */
    .app-content {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 88px 18px 120px 18px;
    }

    /* KART VE GİRİŞ ANİMASYONLARI */
    @keyframes viewSlideUp {
      from { opacity: 0; transform: translateY(16px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .anim-item {
      opacity: 0;
      animation: viewSlideUp 0.42s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: calc(var(--i, 0) * 60ms);
    }

    .glass-card {
      background: var(--bg-surface);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      border: 1px solid var(--border-glass);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 12px 32px -12px rgba(0, 0, 0, 0.45);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s, box-shadow 0.25s;
    }
    .glass-card.interactive:hover {
      transform: translateY(-3px);
      border-color: var(--border-highlight);
      box-shadow: 0 16px 36px -10px rgba(0, 0, 0, 0.55), 0 0 24px -8px var(--accent-glow);
    }

    /* BUTONLAR */
    .btn-glow {
      background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 11px 18px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px -4px var(--accent-glow);
      transition: transform 0.18s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.18s, filter 0.18s;
    }
    .btn-glow:hover { transform: translateY(-2px) scale(1.02); filter: brightness(1.07); }
    .btn-glow:active { transform: scale(0.96); }

    .btn-soft {
      background: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-glass);
      border-radius: 13px;
      padding: 10px 15px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.18s ease;
    }
    .btn-soft:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
    .btn-soft:active { transform: scale(0.96); }

    .btn-danger-soft {
      background: rgba(244, 63, 94, 0.12);
      color: var(--danger);
      border: 1px solid rgba(244, 63, 94, 0.25);
      border-radius: 12px;
      padding: 8px 13px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.18s;
    }
    .btn-danger-soft:hover { background: rgba(244, 63, 94, 0.22); transform: translateY(-1px); }

    /* FORM GİRİŞLERİ */
    .input-modern {
      width: 100%;
      background: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 13px 15px;
      font-size: 15px;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-modern:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    /* KİTAP KAPAĞI 3D */
    .book-item-grid {
      display: grid;
      grid-template-columns: 64px 1fr;
      gap: 16px;
      align-items: center;
    }
    .book-cover-3d {
      width: 64px;
      height: 92px;
      border-radius: 6px 10px 10px 6px;
      background: linear-gradient(145deg, #f59e0b, #7c2d12);
      box-shadow: -3px 0 0 rgba(255,255,255,0.2) inset, 0 8px 18px rgba(0,0,0,0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 22px;
      color: rgba(255,255,255,0.9);
      overflow: hidden;
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .glass-card:hover .book-cover-3d {
      transform: perspective(400px) rotateY(-8deg) scale(1.04);
    }
    .book-cover-3d img { width: 100%; height: 100%; object-fit: cover; }

    /* İLERLEME ÇUBUĞU */
    .progress-track {
      width: 100%;
      height: 9px;
      background: rgba(255,255,255,0.07);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #ea580c);
      background-size: 200% 100%;
      border-radius: 999px;
      transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      animation: shimmerBar 3s infinite linear;
    }
    @keyframes shimmerBar {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }

    /* ALT SEKME ÇUBUĞU (FLOATING DOCK) */
    .tab-bar {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 520px;
      height: 68px;
      background: var(--bg-surface);
      backdrop-filter: blur(24px) saturate(190%);
      -webkit-backdrop-filter: blur(24px) saturate(190%);
      border: 1px solid var(--border-glass);
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 8px;
      z-index: 1000;
    }
    .tab-item {
      background: none; border: none;
      color: var(--text-muted);
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      font-size: 11px; font-weight: 600;
      cursor: pointer; padding: 8px 14px;
      border-radius: 14px;
      transition: all 0.22s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .tab-item svg { width: 21px; height: 21px; transition: transform 0.22s; }
    .tab-item.active {
      color: var(--accent);
      background: var(--accent-soft);
    }
    .tab-item.active svg { transform: translateY(-2px) scale(1.1); }

    .tab-action-wrapper { display: flex; align-items: center; justify-content: center; }
    .tab-action-btn {
      width: 56px; height: 56px; border-radius: 50%;
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff; border: 3px solid var(--bg-deep);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 24px var(--accent-glow);
      cursor: pointer;
      transform: translateY(-14px);
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s;
    }
    .tab-action-btn:hover { transform: translateY(-17px) scale(1.07); box-shadow: 0 12px 30px var(--accent-glow); }
    .tab-action-btn:active { transform: translateY(-12px) scale(0.95); }
    .tab-action-btn svg { width: 24px; height: 24px; margin-left: 2px; }

    /* ÇİPLER */
    .chip-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: none; }
    .chip-row::-webkit-scrollbar { display: none; }
    .chip-btn {
      background: var(--bg-elevated);
      color: var(--text-muted);
      border: 1px solid var(--border-glass);
      border-radius: 999px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip-btn.active {
      background: linear-gradient(135deg, #f59e0b, #ea580c);
      color: #fff;
      border-color: transparent;
      box-shadow: 0 4px 14px var(--accent-glow);
    }

    /* ZAMANLAYICI AURA VE EKOLAYZIR */
    .timer-ring-wrap {
      position: relative;
      width: 230px; height: 230px;
      margin: 18px auto 24px auto;
      display: flex; align-items: center; justify-content: center;
    }
    .timer-pulse-ring {
      position: absolute; inset: 0;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
    }
    .timer-running .timer-pulse-ring {
      animation: auraPulse 2.4s infinite ease-out;
    }
    @keyframes auraPulse {
      0% { transform: scale(0.92); opacity: 0.65; }
      100% { transform: scale(1.22); opacity: 0; }
    }
    .eq-bars {
      display: inline-flex; align-items: flex-end; gap: 3px; height: 16px; margin-left: 6px;
    }
    .eq-bar {
      width: 3px; background: var(--accent); border-radius: 2px;
      animation: eqBounce 0.8s infinite ease-in-out alternate;
    }
    .eq-bar:nth-child(2) { animation-delay: 0.2s; }
    .eq-bar:nth-child(3) { animation-delay: 0.4s; }
    @keyframes eqBounce { 0% { height: 4px; } 100% { height: 16px; } }

    /* MODAL */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(10px);
      z-index: 3000;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-card {
      background: var(--bg-surface);
      backdrop-filter: blur(24px);
      border: 1px solid var(--border-highlight);
      border-radius: 24px;
      width: 100%; max-width: 460px;
      max-height: 90vh; overflow-y: auto;
      padding: 24px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.65);
    }

    /* TOAST */
    #toast-container {
      position: fixed;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      pointer-events: none;
      display: flex; flex-direction: column; gap: 8px;
      width: 90%; max-width: 380px;
    }
    .toast-item {
      pointer-events: auto;
      background: var(--bg-elevated);
      backdrop-filter: blur(16px);
      color: var(--text-main);
      border: 1px solid var(--accent);
      padding: 12px 18px;
      border-radius: 16px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.45);
      font-size: 13.5px;
      font-weight: 600;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- ARKA PLAN AURORA VFX KATMANI -->
  <div class="aurora-bg" aria-hidden="true">
    <div class="aurora-orb orb-1"></div>
    <div class="aurora-orb orb-2"></div>
    <div class="aurora-orb orb-3"></div>
  </div>

  <!-- CANVAS PARÇACIK / KONFETİ VFX KATMANI -->
  <canvas id="vfx-canvas" aria-hidden="true"></canvas>

  <!-- SABİT ÜST BAŞLIK -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand-container">
        <div class="brand-icon-wrap">📖</div>
        <div>
          <h1 class="brand-title">Satır</h1>
          <span class="brand-subtitle" id="header-user-badge">Giriş Yapılmadı • Bulut Hazır</span>
        </div>
      </div>

      <div class="header-actions">
        <button type="button" class="streak-pill" id="header-streak-pill" title="Okuma Serisi">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M12 23c-4.97 0-9-3.8-9-8.5 0-3.37 2.06-6.38 4.28-8.83.69-.76 1.41-1.5 2.12-2.27.42-.45 1.09-.5 1.57-.11.48.38.6 1.06.27 1.57-.68 1.05-1.24 2.21-1.24 3.44 0 2.14 1.74 3.9 3.88 3.9.72 0 1.4-.2 1.99-.54 1.16-.67 1.88-1.92 1.88-3.26 0-.3-.04-.6-.11-.88-.16-.64.22-1.29.85-1.46.63-.16 1.28.23 1.45.86.3 1.1.46 2.24.46 3.4 0 4.14-3.36 7.5-7.5 7.5z"/>
          </svg>
          <span id="streak-count-text">0 gün</span>
        </button>

        <button type="button" class="sync-status-indicator" id="header-sync-indicator" title="Hesap ve Bulut Eşleme">
          <span class="sync-dot" id="header-sync-dot"></span>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ANA İÇERİK ALANI -->
  <main class="app-content" id="app-view-container"></main>

  <!-- SABİT ALT SEKME ÇUBUĞU -->
  <nav class="tab-bar" aria-label="Ana Gezinti">
    <button type="button" class="tab-item active" data-tab="today" aria-label="Bugün">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Bugün</span>
    </button>

    <button type="button" class="tab-item" data-tab="library" aria-label="Kitaplık">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span>Kitaplık</span>
    </button>

    <div class="tab-action-wrapper">
      <button type="button" class="tab-action-btn" id="tab-btn-timer" aria-label="Okumaya Başla">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <polygon points="6 4 20 12 6 20 6 4"/>
        </svg>
      </button>
    </div>

    <button type="button" class="tab-item" data-tab="stats" aria-label="İstatistik">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span>İstatistik</span>
    </button>

    <button type="button" class="tab-item" data-tab="settings" aria-label="Hesap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
      <span>Hesap</span>
    </button>
  </nav>

  <!-- BİLDİRİM KONTEYNERİ -->
  <div id="toast-container"></div>

  <!-- ?v=5.0 PARAMETRESİ ESKİ SERVICE WORKER CACHE KİLİDİNİ AŞAR -->
  <script src="js/app.js?v=5.0"></script>
</body>
</html>
