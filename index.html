<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  
  <title>Satır - Okuma Günlüğü</title>
  <meta name="description" content="Sakin, odaklı ve kişisel kitap okuma takip günlüğü." />
  
  <!-- iOS Safari PWA Meta Etiketleri -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Satır" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="apple-touch-startup-image" href="icons/icon-512.png" />

  <!-- PWA Web App Manifest -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#18181b" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icons/favicon.png" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />

  <!-- CSS Dosyaları (Saf Vanilla, Bağımlılıksız) -->
  <link rel="stylesheet" href="css/themes.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <!-- SABİT ÜST BAŞLIK (HEADER) -->
  <header class="app-header">
    <div class="brand-container">
      <img src="icons/icon-180.png" alt="Satır Logo" class="brand-logo" />
      <h1 class="brand-title">Satır</h1>
    </div>

    <div class="header-actions">
      <!-- Günlük Seri Hapı -->
      <div class="streak-pill" id="header-streak-pill" title="Mevcut Okuma Serisi">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M12 23c-4.97 0-9-3.8-9-8.5 0-3.37 2.06-6.38 4.28-8.83.69-.76 1.41-1.5 2.12-2.27.42-.45 1.09-.5 1.57-.11.48.38.6 1.06.27 1.57-.68 1.05-1.24 2.21-1.24 3.44 0 2.14 1.74 3.9 3.88 3.9.72 0 1.4-.2 1.99-.54 1.16-.67 1.88-1.92 1.88-3.26 0-.3-.04-.6-.11-.88-.16-.64.22-1.29.85-1.46.63-.16 1.28.23 1.45.86.3 1.1.46 2.24.46 3.4 0 4.14-3.36 7.5-7.5 7.5-.55 0-1-.45-1-1s.45-1 1-1c3.03 0 5.5-2.47 5.5-5.5 0-.7-.14-1.38-.39-2.01-.2-.51.05-1.09.56-1.29.51-.2 1.09.05 1.29.56.32.81.49 1.68.49 2.58 0 3.75-2.91 6.88-6.62 7.18-.3.02-.6.04-.9.04z"/>
        </svg>
        <span>0 gün</span>
      </div>

      <!-- Bulut Sync Durum Göstergesi -->
      <button class="sync-status-indicator offline" id="header-sync-indicator" aria-label="Bulut Eşleme Durumu">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ANA İÇERİK KAYDIRMA ALANI -->
  <main class="app-content" id="app-view-container">
    <!-- Router tarafından dinamik görünümler buraya çizilir -->
    <div style="text-align: center; padding: 60px 20px;">
      <div class="skeleton" style="width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 20px auto;"></div>
      <div class="skeleton" style="width: 200px; height: 24px; margin: 0 auto 12px auto;"></div>
      <div class="skeleton" style="width: 140px; height: 16px; margin: 0 auto;"></div>
    </div>
  </main>

  <!-- SABİT ALT SEKME ÇUBUĞU (5 SEKME + ORTA BUTON) -->
  <nav class="tab-bar" aria-label="Ana Gezinti">
    <!-- 1. Bugün -->
    <button class="tab-item active" data-tab="today" aria-label="Bugün">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      <span>Bugün</span>
    </button>

    <!-- 2. Kitaplık -->
    <button class="tab-item" data-tab="library" aria-label="Kitaplık">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span>Kitaplık</span>
    </button>

    <!-- 3. Ortadaki Belirgin Okuma / Zamanlayıcı Butonu -->
    <div class="tab-action-wrapper">
      <button class="tab-action-btn" id="tab-btn-timer" aria-label="Okumaya Başla">
        <svg viewBox="0 0 24 24">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
      </button>
    </div>

    <!-- 4. İstatistik -->
    <button class="tab-item" data-tab="stats" aria-label="İstatistik">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <line x1="18" y1="20" x2="18" y2="10"/>
        <line x1="12" y1="20" x2="12" y2="4"/>
        <line x1="6" y1="20" x2="6" y2="14"/>
      </svg>
      <span>İstatistik</span>
    </button>

    <!-- 5. Profil / Ayarlar -->
    <button class="tab-item" data-tab="settings" aria-label="Profil ve Ayarlar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      <span>Profil</span>
    </button>
  </nav>

  <!-- TOAST BİLDİRİM KONTEYNERİ -->
  <div id="toast-container" class="toast-container"></div>

  <!-- UYGULAMA GİRİŞ SCRIPTI (ES MODÜLÜ) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
